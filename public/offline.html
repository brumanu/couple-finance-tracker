<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sem conexão — Financeiro</title>
    <!--
      Página que o service worker (sw.js) entrega quando o app é aberto sem
      internet. Tudo inline de propósito: offline não há como buscar CSS,
      fonte nem JS do Next. Cores copiadas dos tokens de globals.css.
    -->
    <script>
      try {
        var t = localStorage.getItem("theme");
        var dark = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.className = "dark";
      } catch (e) {}
    </script>
    <style>
      :root {
        --bg: #f5ead8;
        --text: #201e1d;
        --muted: #645c50;
        --accent: #c67139;
        --on-accent: #f5ead8;
      }
      .dark {
        --bg: #1c1714;
        --text: #f5ead8;
        --muted: #cabfae;
        --accent: #e08a52;
        --on-accent: #201b16;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      main { max-width: 22rem; text-align: center; }
      .icone {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 64px;
        height: 64px;
        border-radius: 18px;
        background: var(--accent);
        color: var(--on-accent);
        font-weight: 800;
        font-size: 26px;
        letter-spacing: -0.03em;
      }
      h1 { margin: 20px 0 8px; font-size: 24px; line-height: 1.2; }
      p { margin: 0; font-size: 16px; line-height: 1.5; color: var(--muted); }
      button {
        margin-top: 24px;
        min-height: 48px;
        padding: 0 28px;
        border: 0;
        border-radius: 999px;
        background: var(--accent);
        color: var(--on-accent);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:active { opacity: 0.85; }
      button:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="icone" aria-hidden="true">R$</div>
      <h1>Sem conexão</h1>
      <p>
        O Financeiro precisa de internet pra mostrar as contas. Assim que o
        sinal voltar, a página abre sozinha.
      </p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
    </main>
    <script>
      // Volta sozinho quando a conexão retorna — no mercado o sinal vai e vem.
      addEventListener("online", function () { location.reload(); });
    </script>
  </body>
</html>
